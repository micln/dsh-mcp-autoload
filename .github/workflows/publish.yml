name: Publish to npm

# 打 tag（v0.2.1 / v0.3.0 …）即发布；在 GitHub 网页上创建 Release 也会触发。
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm >= 11.5.1
      - run: npm install -g npm@latest

      - name: Check tag against package.json
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag v$tag does not match package.json version $version"
              exit 1
            fi
          fi
          echo "publishing dsh-mcp-autoload@$version"

      - run: npm test --if-present

      - name: Check whether this version is already on npm
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-mcp-autoload@$version" version >/dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-mcp-autoload@$version is already published, skipping"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.yes == 'false'
        run: npm publish --provenance

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
